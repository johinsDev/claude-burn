[workspace]
resolver = "2"
members = ["crates/burn-core", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
memchr = "2"
notify = "7"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
dirs = "5"
